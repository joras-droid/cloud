name: gharkoswad-dev

# Local development: only the stateful services run in Docker. The Next.js dev
# server runs on the host so hot reload stays fast.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gks
      POSTGRES_PASSWORD: gks
      POSTGRES_DB: gharkoswad
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    # 5433 on the host: 5432 is commonly taken by a local Postgres install.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gks"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata_dev:
